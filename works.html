    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const body = document.body;
            const videoSection = document.getElementById('video');
            const iframe = videoSection.querySelector('iframe');
            const closeButton = videoSection.querySelector('.close-video');
            const films = document.querySelectorAll('.film[data-video]');
            const activeClass = 'opened';

            const toggleVideoState = (isOpen) => {
                videoSection.classList.toggle(activeClass, isOpen);
                videoSection.setAttribute('aria-hidden', String(!isOpen));
                body.classList.toggle('video-open', isOpen);

                if (isOpen) {
                    const scrollBarWidth = window.innerWidth - document.documentElement.clientWidth;
                    body.style.paddingRight = scrollBarWidth > 0 ? `${scrollBarWidth}px` : '';
                } else {
                    body.style.paddingRight = '';
                }
            };

            const openVideo = (baseUrl = '') => {
                if (!baseUrl) {
                    return;
                }
                const autoplayUrl = baseUrl.includes('autoplay=1')
                    ? baseUrl
                    : `${baseUrl}${baseUrl.includes('?') ? '&' : '?'}autoplay=1`;
                iframe.src = autoplayUrl;
                toggleVideoState(true);
            };

            const closeVideo = () => {
                if (!videoSection.classList.contains(activeClass)) {
                    return;
                }
                iframe.src = '';
                toggleVideoState(false);
            };

            films.forEach((film) => {
                film.addEventListener('click', () => openVideo(film.dataset.video));
            });

            closeButton.addEventListener('click', closeVideo);

            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape') {
                    closeVideo();
                }
            });
        });
    </script>
